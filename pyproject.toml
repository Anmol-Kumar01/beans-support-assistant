[project]
name = "beans-support-assistant"
version = "0.1.0"
description = "Beans Support Assistant: RAG support chatbot and knowledge hub"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
app = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
